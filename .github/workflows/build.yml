name: Build site

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.110.0"
          extended: true
      - run: hugo
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
