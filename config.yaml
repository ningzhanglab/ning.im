baseURL: "https://ning.im/"
languageCode: "en-us"
title: "Ning Zhang"
theme: "hugo-ivy"

# --- 核心配置 ---
hasCJKLanguage: true     # 优化中文统计
enableEmoji: true        # 支持 Emoji
enableRobotsTXT: true    # 【SEO】自动生成 robots.txt
enableGitInfo: false     # 【修复】暂时关闭，防止报错 "Failed to read Git log"

# --- Sitemap 配置 (SEO) ---
sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

# --- 忽略文件 ---
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

# --- 链接结构 ---
# 保持你原来的设置，这对应你的 content/cn 和 content/en 文件夹
permalinks:
  cn: "/:sections/:year/:month/:slug/"
  en: "/:sections/:year/:month/:slug/"

rssLimit: 10
footnotereturnlinkcontents: "↩"



menu:
  main:
    - name: "About"
      url: "/en/about/"
      weight: 1
    - name: "Blog"
      url: "/en/"
      weight: 2
    - name: "关于"
      url: "/cn/about/"
      weight: 3
    - name: "日志"
      url: "/cn/"
      weight: 4
    - name: "CV"
      url: "/CV/"
      weight: 5

params:
  description: "Personal website of Ning Zhang"
  footer: "&copy; [Ning Zhang](/) 2022 - {Year}"
  customJS:
    - "comment-utils.js"
    - "fix-toc.js"
    - "center-img.js"
    - "right-quote.js"
    - "no-highlight.js"
    - "fix-footnote.js"
    - "math-code.js"
    - "hash-notes.js"
    - "toggle-notes.js"
    - "post-nav.js"
    - "external-link.js"
    - "alt-title.js"
    - "header-link.js"
  twitterImage: "/images/logo.png"

  logo:
    en:
      img: "/images/logo.png"
      url: "/"      # 英文版 Logo 点击跳到这里
    cn:
      img: "/images/logo.png"
      url: "/"      # 中文版 Logo 点击跳到这里（之前是 /cn/，现在改成了 /）

  author:
    en: "Ning Zhang"
    cn: "Ning Zhang"

# 代码高亮设置
  highlightjsVersion: "11.7.0"
  highlightjsLang: ["latex", "r", "python"] # 我帮你加了 R 和 Python，因为看你用 RMarkdown
  highlightjsTheme: "base16/heetch-light"

# --- Markdown 渲染设置 ---
blackfriday:
    extensionsmask: ["noIntraEmphasis"]
    fractions: false

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true # 允许在 Markdown 中写 HTML
    parser:
      autoHeadingIDType: blackfriday
  tableOfContents:
    startLevel: 1